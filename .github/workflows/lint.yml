#What is the goal of your workflow
# Goal: Whenever someone changes the python code,
#the linter will check if the syntax, format, identation(Linting) is correct or not
name: Auto Linter

on:
  push:
    paths: "*.py"

jobs:
  code:
    runs-on: ubuntu-latest
    steps:
    #this steps will automatically clone the code of the current branch into the runner branch
      - name: Checkout/Clone the code
        uses: actions/checkout@v4
      #this step will install the linting tool
      - name: Install Linter
        run: pip install ruff
      #this step will run the linter
      - name: Check the files for linting
        run: ruff check .
